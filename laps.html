<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <!--클릭 버튼 실습-->
    <h3>internal JS</h3>
    <button id="clickBtn" onclick="clickMe()">Click me</button>

    <!--클릭 버튼 실습-->
    <h3>inline JS</h3>
    <button id="inline" onclick="alert('Have a good day!')">Click me</button>


    <!--덧셈 실습-->
    <div class="cal">
        <h1>덧셈 계산기</h1>
        <input type="text" id="num1" size="4">
        <input type="text" id="num2" size="4">
        <button onclick="add()" id="addBtn">+</button>
        <input id="result" readonly>

    </div>

    <script>
        function add() {
            const num1 = document.querySelector("#num1").value;
            const num2 = document.querySelector("#num2").value;
            const result = Number(num1) + Number(num2);

            document.querySelector("#result").value = result;
        }
        function clickMe() {
           alert('Have a good day');
        }

        
</script>
</body>


</html>
