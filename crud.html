<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="index.html">공동 Todo list 관리</a>
        </div>
    </nav>

    <div class="container">
        <form id="list">
            <h2>일정 추가하기</h2>
            <label for="what">일정 이름은?</label>
            <input type="text" class="form-control" id="name" name="what" placeholder="일정의 이름을 적어주세요">
            <label for="whatkind">어떤 종류의 일정인가요?</label>
            <input list="schedule-types" class="form-control" name="category" id="whatkind" placeholder="ex.학교, 개인일정 등">

            <datalist id="schedule-types">
                <option value="학교"></option>
                <option value="개인 일정"></option>
                <option value="교회 일정"></option>
                <option value="가족 일정"></option>
                <option value="동아리 일정"></option>
                <option value="여자친구"></option>
            </datalist>
            <label for="when">언제까지 or 언제인지</label>
            <input type="date" class="form-control" id="date" name="when" required>
            <div class="d-flex align-items-center gap-2 flex-nowrap">
                <div class="form-check form-check-inline m-0 text-nowrap flex-shrink-0">
                <input class="form-check-input" type="radio" id="who1" name="information" value="남자친구">
                <label class="form-check-label"for="who1">남자친구</label>
                </div>
                <div class="form-check form-check-inline m-0 text-nowrap flex-shrink-0">
                <input class="form-check-input" type="radio" id="who2" name="information" value="여자친구">
                <label class="form-check-label" for="who2">여자친구</label>
                </div>
                <label for="whos" class="ms-2 mb-0 text-nowrap flex-shrink-0">이메일</label>
                <input type="email" class="form-control form-control-sm flex-grow-1" id="email" name="whos" placeholder="이메일을 입력해주세요">
            </div>
            <button type="submit" class="btn btn-primary">등록</button>
        </form>
    </div>
    <div class="container">
        <h2>Todo list</h2>
        <ul id="dolist"><ul>
    </div>


</body>

</html>
