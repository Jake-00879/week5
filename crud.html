<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
    <script>
        let todoList = [{
            id: 1,
            doname: "운동",
            dokind: "exercise",
            dowhen: "2026-10-07",
            doemail: "22300283@handong.ac.kr",
            dobtn: "남자친구"
        }, {
            id: 2,
            doname: "노래방",
            dokind: "개인일정",
            dowhen: "2026-10-07",
            doemail: "22300283@handong.ac.kr",
            dobtn: "남자친구"
        }, {
            id: 3,
            doname: "방청소",
            dokind: "개인 일정",
            dowhen: "2026-10-08",
            doemail: "22300283@handong.ac.kr",
            dobtn: "남자친구"
        }];

        let editingId = null;

        function removeItem(id) {
            const sure = confirm("삭제하시겠습니까?");
            if (!sure) {
                return;
            }
            todoList = todoList.filter(todo => todo.id != id)
            //어떻게 삭제할 건지
            renderList();
        }
        function modifyItem(id) {
            const target = todoList.find(todo => todo.id == id);
            if (!target) return;

            document.querySelector('#name').value = target.doname;
            document.querySelector('#whatkind').value = target.dokind;
            document.querySelector('#date').value = target.dowhen;
            document.querySelector('#email').value = target.doemail;

            const radio = document.querySelector(`input[name="information"][value="${target.dobtn}"]`);
            if (radio) radio.checked = true;
            document.querySelector("#btn").textContent = "수정 완료";
            editingId = id;
            //어떻게 수정 받을 건지
        }
        function renderList() {

            const list = document.querySelector('#dolist');

            list.innerHTML = "";

            todoList.forEach(function (todo) { // ai도움 받음
                const li = document.createElement("li");

                li.textContent = `${todo.doname} - ${todo.dokind}, ${todo.dowhen} - ${todo.dobtn}`;
                li.className = "mb-3";

                const buttonm = document.createElement("button");
                buttonm.textContent = "수정";
                buttonm.className = "btn btn-sm btn-outline-primary me-1";
                buttonm.addEventListener("click", function () {
                    modifyItem(todo.id);
                });

                const buttonx = document.createElement("button");
                buttonx.textContent = "삭제";
                buttonx.className = "btn btn-sm btn-outline-danger";
                buttonx.addEventListener("click", function () {
                    removeItem(todo.id);
                });

                li.appendChild(buttonm);
                li.appendChild(buttonx);
                list.appendChild(li);
            });
        }

        function addTodo(doname, dokind, dowhen, doemail, dobtn) {
            const newTodo = {
                id: Date.now(), // 고유 ID값
                doname: doname,
                dokind: dokind,
                dowhen: dowhen,
                doemail: doemail,
                dobtn: dobtn
            };

            todoList.push(newTodo);
        }

        window.addEventListener("load", function () {
            const form = document.querySelector('#list');
            const doname = document.querySelector("#name");
            const dokind = document.querySelector("#whatkind");
            const dowhen = document.querySelector("#date");
            const doemail = document.querySelector("#email");
            const dobtn = document.querySelector("#btn");
            renderList();

            dobtn.addEventListener("click", function (e) {
                e.preventDefault();
                if (!list.checkValidity()) {
                    list.reportValidity(); 
                    return; 
                }

                const checkedWho = document.querySelector('input[name="information"]:checked');
                if (editingId !== null) {
                    const target = todoList.find(todo => todo.id == editingId);
                    if (target) {
                        target.doname = document.querySelector("#name").value;
                        target.dokind = document.querySelector("#whatkind").value;
                        target.dowhen = document.querySelector("#date").value;
                        target.doemail = document.querySelector("#email").value;

                        target.dobtn = checkedWho ? checkedWho.value : "선택 안 함";

                    }
                    editingId = null;
                    dobtn.textContent = "등록";
                } else {
                    addTodo(doname.value, dokind.value, dowhen.value, doemail.value, checkedWho ? checkedWho.value : "선택 안 함");
                }
                doname.value = "";
                dokind.value = "";
                dowhen.value = "";
                doemail.value = "";
                if (checkedWho) checkedWho.checked = false; // 이 부분도 ai 도움받음
                doname.focus();
                renderList();

            });

        });
    </script>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold">공동 Todo list 관리</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800;">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <form id="list">
                    <h2 class="card-title h4 fw-bold text-primary mb-3">일정 추가하기</h2>
                    <div class="mb-3">
                    <label for="what">일정 이름은?</label>
                    <input type="text" class="form-control" id="name" name="what" placeholder="일정의 이름을 적어주세요" required
                        minlength="2">
                    </div>
                    <div class="mb-3">
                    <label for="whatkind">어떤 종류의 일정인가요?</label>
                    <input list="schedule-types" class="form-control" name="category" id="whatkind"
                        placeholder="ex.학교, 개인일정 등" required minlength="2">
                        </div>
                    <datalist id="schedule-types">
                        <option value="학교"></option>
                        <option value="개인 일정"></option>
                        <option value="교회 일정"></option>
                        <option value="가족 일정"></option>
                        <option value="동아리 일정"></option>
                        <option value="여자친구"></option>
                    </datalist>
                    <div class="mb-3">
                    <label for="when">언제까지 or 언제인지</label>
                    <input type="date" class="form-control" id="date" name="when" required>
                    </div>
                    <div class="mb-3">
                    <div class="d-flex align-items-center gap-2 flex-nowrap">
                        <div class="form-check form-check-inline m-0 text-nowrap flex-shrink-0">
                            <input class="form-check-input" type="radio" id="who1" name="information" value="남자친구">
                            <label class="form-check-label" for="who1">남자친구</label>
                        </div>
                        <div class="form-check form-check-inline m-0 text-nowrap flex-shrink-0">
                            <input class="form-check-input" type="radio" id="who2" name="information" value="여자친구">
                            <label class="form-check-label" for="who2">여자친구</label>
                        </div>
                        <label for="whos" class="ms-2 mb-0 text-nowrap flex-shrink-0">이메일</label>
                        <input type="email" class="form-control form-control-sm flex-grow-1" id="email" name="whos"
                            placeholder="이메일을 입력해주세요" required>
                    </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn">등록</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container card shadow-sm border-0 mb-4" style="max-width: 800;">
        <div class="card-body p-4">
            <h2>Todo list</h2>
            <ul id="dolist"></ul>
        </div>
    </div>


</body>

</html>
