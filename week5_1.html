<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function checkForm(e) {
            const uname= document.querySelector("#username");
            if(uname.value === ''){
                alert('이름을 입력하세요.');
                uname.focus();
                e.preventDefault();
            } else{
                alert('validation');
            }
        }

        function changeForm(){
            const rename = document.querySelector('#username');
            rename.focus();
            rename.placeholder = "이름을 다시 입력해주세요";
        }

        window.addEventListener("load", function(){
            const uform = document.querySelector('#userform');
            uform.addEventListener("submit", checkForm);
            uform.addEventListener("reset", changeForm);

        });

    </script>



</head>

<body>

    <form id="userform" action="login_ok.html" method="POST">
        <input id="username" type="text" name="username" placeholder="이름을 입력해주세요">
        <input type="submit" value="로그인">
        <input type="reset" value="리셋">
    </form>


</body>

</html>
